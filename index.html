<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#02040a" />
  <meta name="description" content="小酷《飞蚊症》非官方互动音乐碎片体验。" />
  <title>飞蚊症 / FLOATERS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="stage">
    <section class="scene intro" aria-label="进入飞蚊症互动体验">
      <div class="eye-stage" id="eyeStage">
        <div class="eye-reveal" aria-hidden="true">
          <svg class="eye-svg" viewBox="0 0 1200 600" role="img" aria-label="由粗糙蓝白线条绘制的眼睛">
            <defs>
              <filter id="paperWobble" x="-12%" y="-18%" width="124%" height="136%">
                <feTurbulence type="fractalNoise" baseFrequency=".012 .045" numOctaves="2" seed="17" result="noise" />
                <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G" />
              </filter>
              <filter id="softGlow" x="-160%" y="-160%" width="420%" height="420%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <radialGradient id="irisWash" cx="46%" cy="42%" r="62%">
                <stop offset="0" stop-color="#eef6ff" stop-opacity=".28" />
                <stop offset=".28" stop-color="#8cace5" stop-opacity=".16" />
                <stop offset=".66" stop-color="#183568" stop-opacity=".18" />
                <stop offset="1" stop-color="#02050d" stop-opacity=".72" />
              </radialGradient>
            </defs>
            <g filter="url(#paperWobble)">
              <path class="sketch-line contour-main" d="M52 349 C137 285 186 205 308 169 C448 126 582 125 701 137 C873 151 1004 208 1151 303" />
              <path class="sketch-line contour-main" d="M49 352 C172 411 277 478 427 491 C606 508 749 491 883 449 C1007 410 1085 353 1151 303" />
              <path class="sketch-line contour-echo" d="M72 329 C211 247 299 189 438 157 C589 123 762 151 896 187 C1018 220 1080 273 1135 318" />
              <path class="sketch-line contour-echo" d="M69 366 C194 425 319 456 453 472 C612 491 776 461 900 419 C1002 384 1078 337 1137 314" />
              <path class="sketch-line contour-echo" d="M105 390 C228 444 333 507 505 515 C711 525 892 452 1044 375" />
              <path class="sketch-line contour-scratch" d="M83 307 C173 207 312 138 459 113 C659 78 871 126 1078 241" />
              <path class="sketch-line contour-scratch" d="M123 410 C292 514 489 548 685 524 C856 503 1010 430 1102 351" />
              <path class="sketch-line contour-main lashes" d="M77 334 L36 288 M129 285 L91 223 M205 222 L178 153 M302 175 L286 104 M421 143 L413 64 M550 132 L559 51 M713 141 L737 79 M853 171 L900 108 M972 215 L1027 160 M1060 261 L1130 229" />
              <path class="sketch-line contour-main lashes" d="M84 372 L38 415 M164 421 L128 478 M276 463 L253 529 M407 492 L397 556 M548 507 L552 575 M711 493 L734 553 M853 454 L894 516 M980 403 L1033 458 M1081 350 L1153 381" />
              <g class="iris-gaze">
                <path class="iris-wash" d="M472 307 C470 224 520 174 602 166 C691 157 754 216 755 301 C758 393 699 443 609 448 C519 452 466 399 472 307 Z" />
                <path class="sketch-line iris-ring" d="M477 307 C470 220 523 176 604 166 C687 158 752 214 756 299 C760 386 708 438 617 449 C531 457 472 399 477 307 Z" />
                <path class="sketch-line iris-ring thin" d="M497 305 C494 236 534 195 605 187 C676 179 729 229 733 303 C737 373 692 417 615 426 C542 432 501 382 497 305 Z" />
                <path class="sketch-line iris-ring thin" d="M522 307 C519 252 552 216 608 212 C663 208 708 246 708 303 C710 361 673 398 614 402 C555 405 524 364 522 307 Z" />
                <circle class="iris-core" cx="614" cy="307" r="61" />
                <circle class="iris-glint" cx="636" cy="282" r="13" />
                <path class="sketch-line ray" d="M610 150 L611 109 M661 158 L676 116 M705 180 L731 139 M742 219 L780 190 M758 270 L809 260 M759 327 L811 337 M741 375 L781 405 M705 415 L733 457 M658 440 L672 486 M603 451 L600 497 M551 437 L533 482 M509 410 L478 451 M479 367 L435 391 M463 315 L416 316 M472 261 L427 243 M496 217 L461 182 M536 182 L515 139" />
              </g>
              <path class="sketch-line scratch" d="M184 331 L229 305 M281 382 L334 357 M365 232 L418 251 M770 220 L826 193 M793 371 L849 399 M932 301 L989 279" />
            </g>
            <g class="lid-shades" aria-hidden="true">
              <path class="lid-shade lid-upper" d="M0 0 H1200 V327 C1015 202 857 153 699 145 C531 137 321 154 0 348 Z" />
              <path class="lid-shade lid-lower" d="M0 600 H1200 V307 C1021 414 849 474 686 491 C486 512 254 477 0 350 Z" />
            </g>
          </svg>
        </div>
        <button class="pupil-entry" id="enter" aria-label="点击瞳孔进入音乐碎片空间"></button>
        <p class="enter-copy">让光停在瞳孔上<small>FIND THE PUPIL · CLICK TO ENTER · 建议开启声音</small></p>
      </div>
    </section>

    <section class="scene world" id="world" aria-label="飞蚊症音乐碎片探索空间" data-mood="retinal">
      <div class="world-haze"></div>
      <div class="depth-ring"></div>
      <div class="album-presence"><img src="cover.webp" alt="小酷《飞蚊症》专辑封面" /></div>
      <div class="lamp-field" aria-hidden="true"></div>
      <div class="track-nodes" id="trackNodes"></div>
      <div class="fragment-caption" id="fragmentCaption" aria-live="polite">
        <small id="fragmentOrder">FRAGMENT 01</small>
        <strong id="fragmentTitle">灯火</strong>
        <div class="fragment-progress"><i id="fragmentProgress"></i></div>
      </div>
      <p class="world-hint" id="worldHint">别追它。停下来，让一个片段自己浮近。</p>
      <div class="credits">UNOFFICIAL FAN-MADE EXPERIENCE · 2026</div>
    </section>

    <div class="floater-field" id="floaterField" aria-hidden="true"></div>

    <header class="hud">
      <div class="brand"><strong>FLOATERS</strong><span>MUSIC FRAGMENTS IN THE EYE</span></div>
      <div class="tools">
        <span class="counter" id="counter">00 / 06</span>
        <button class="tool" id="sound" aria-label="关闭声音" title="声音">◉</button>
        <button class="tool" id="reset" aria-label="返回眼睛" title="返回">↺</button>
      </div>
    </header>
    <div class="mist"></div>
    <div class="ambient-light"></div>
    <div class="scanlines"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
